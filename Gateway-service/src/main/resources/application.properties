spring.application.name=Gateway-service
server.port=8080
eureka.client.service-url.defaultZone=${DISCOVERY_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
jwt.expiration=${jwt.expiration}
jwt.secret=${JWT_SECRET}

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

springdoc.swagger-ui.urls[0].name=patient-service
springdoc.swagger-ui.urls[0].url=/docs/patients/v3/api-docs

springdoc.swagger-ui.urls[1].name=history-service
springdoc.swagger-ui.urls[1].url=/docs/history/v3/api-docs

springdoc.swagger-ui.urls[2].name=evaluation-service
springdoc.swagger-ui.urls[2].url=/docs/evaluation/v3/api-docs

springdoc.swagger-ui.urls[3].name=security-service
springdoc.swagger-ui.urls[3].url=/docs/security/v3/api-docs