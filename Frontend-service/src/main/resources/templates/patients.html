<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Patients</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<div class th:replace="~{layout}"></div>

<a class="btn btn-primary my-3" th:href="@{/patients/add}">Ajouter un patient</a>

<h1>Liste des patients</h1>

<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Date de naissance</th>
        <th>Genre</th>
        <th>Address</th>
        <th>Phone Number</th>
    </tr>

    </thead>

    <tbody>
    <tr th:each="patient : ${patients}">
        <td th:text="${patient.id}"></td>
        <td th:text="${patient.firstName}"></td>
        <td th:text="${patient.lastName}"></td>
        <td th:text="${patient.dateOfBirth}"></td>
        <td th:text="${patient.gender}"></td>
        <td th:text="${patient.address} ?:'Non renseigné'"></td>
        <td th:text="${patient.phoneNumber} ?: 'Non renseigné' "></td>

        <td>
            <a class="btn btn-info btn-sm" th:href="@{'/patients/id/' + ${patient.id}}">Détail</a>
            <a class="btn btn-warning btn-sm" th:href="@{'/patients/edit/id/' + ${patient.id}}">Modifier</a>
            <a class="btn btn-danger btn-sm" th:href="@{'/patients/delete/id/' + ${patient.id}}"
            onclick="return confirm('Supprimer ce patient ?')">
                Supprimer
            </a>
        </td>

    </tr>
    </tbody>
</table>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
