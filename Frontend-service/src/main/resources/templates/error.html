<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erreur</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4 text-center" style="max-width: 500px;">

        <div class="mb-3">
            <h1 class="display-4 text-danger" th:text="${status}">500</h1>
        </div>

        <div class="mb-3">
            <h4 class="text-dark">Une erreur est survenue</h4>
        </div>

        <div class="alert alert-danger" role="alert">
            <span th:text="${message}">Message d'erreur</span>
        </div>

        <div class="d-grid gap-2 mt-3">
            <a href="/patients" class="btn btn-primary">Retour à la liste</a>
        </div>

    </div>

</div>

</body>
</html>
