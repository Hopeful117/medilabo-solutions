<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifier patient</title>
</head>
<div class th:replace="~{layout}"></div>

<h2 class="h2">Modifier patient</h2>

<form class="w-50 mx-3" th:action="@{/patients/edit/id/{id}(id=${id})}"
      th:object="${patient}" method="post">
    <input type="hidden" name="_method" value="put"/>

    <label class="form-label">Prénom</label>
    <input class="form-control form-control-lg" type="text" th:field="*{firstName}" />
    <p class="text-danger" th:errors="*{firstName}" th:if="${#fields.hasErrors('firstName')}"></p>
    <br>

    <label class="form-label">Nom</label>
    <input class="form-control form-control-lg" type="text" th:field="*{lastName}" />
    <p class="text-danger" th:errors="*{lastName}" th:if="${#fields.hasErrors('lastName')}"></p>
    <br>

    <label class="form-label">Date de naissance</label>
    <input
            class="form-control form-control-lg"
            type="date"
            th:value="${#temporals.format(patient.dateOfBirth, 'yyyy-MM-dd')}"
            name="dateOfBirth"
    />
    <p class="text-danger" th:errors="*{dateOfBirth}" th:if="${#fields.hasErrors('dateOfBirth')}"></p>
    <br>

    <label class="form-label">Genre</label>
    <input class="form-control form-control-lg" type="text" th:field="*{gender}" />
    <p class="text-danger" th:errors="*{gender}" th:if="${#fields.hasErrors('gender')}"></p>
    <br>

    <label class="form-label">Adresse</label>
    <input class="form-control form-control-lg" type="text" th:field="*{address}" />
    <p class="text-danger" th:errors="*{address}" th:if="${#fields.hasErrors('address')}"></p>
    <br>


    <label class="form-label">Numéro de téléphone</label>
    <input class="form-control form-control-lg" type="text" th:field="*{phoneNumber}" />
    <p class="text-danger" th:errors="*{phoneNumber}" th:if="${#fields.hasErrors('phoneNumber')}"></p>
    <br>

    <div class="d-flex justify-content-start m-3 gap-2">
        <button class="btn btn-primary" type="submit">Modifier</button>
        <a  class="btn btn-danger btn-sm" href="/patients">Retour à la liste</a>
    </div>

</form>




</html>
